[package]
name = "manga-translate"
version = "0.16.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "MangaTranslate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
koharu-config = { path = "../vendor/koharu-0.70.2/crates/koharu-config" }
koharu-ml = { path = "../vendor/koharu-0.70.2/crates/koharu-ml" }
koharu-pipeline = { path = "../vendor/koharu-0.70.2/crates/koharu-pipeline" }
koharu-rasterizer = { path = "../vendor/koharu-0.70.2/crates/koharu-rasterizer", features = ["native"] }
koharu-renderer = { path = "../vendor/koharu-0.70.2/crates/koharu-renderer" }
koharu-runtime = { path = "../vendor/koharu-0.70.2/crates/koharu-runtime" }
koharu-scene = { path = "../vendor/koharu-0.70.2/crates/koharu-scene" }
koharu-secrets = { path = "../vendor/koharu-0.70.2/crates/koharu-secrets" }
koharu-translator = { path = "../vendor/koharu-0.70.2/crates/koharu-translator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3.24"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tray-icon = "0.24.2"
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[features]
cuda = []

# The Koharu dependency graph produces very large MSVC PDB and incremental
# caches. Local checks/tests do not need debugger symbols in this application.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
