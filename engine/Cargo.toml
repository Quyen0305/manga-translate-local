[package]
name = "manga-translate"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "MangaTranslate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
camino = "1.1"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
koharu-app = { path = "../vendor/koharu/koharu-app" }
koharu-core = { path = "../vendor/koharu/koharu-core" }
koharu-llm = { path = "../vendor/koharu/koharu-llm" }
koharu-runtime = { path = "../vendor/koharu/koharu-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3.24"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "set-header"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tray-icon = "0.24.2"
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[features]
cuda = ["koharu-app/cuda"]

[patch.crates-io]
candle-transformers = { git = "https://github.com/mayocream/candle", branch = "flash-attn" }
candle-core = { git = "https://github.com/mayocream/candle", branch = "flash-attn" }
candle-nn = { git = "https://github.com/mayocream/candle", branch = "flash-attn" }
candle-flash-attn = { git = "https://github.com/mayocream/candle", branch = "flash-attn" }
ug = { git = "https://github.com/mayocream/ug", branch = "cuda-dynamic-loading" }
ug-cuda = { git = "https://github.com/mayocream/ug", branch = "cuda-dynamic-loading" }
